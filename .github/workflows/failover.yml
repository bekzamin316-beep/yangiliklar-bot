name: Render failover

# Railway (asosiy) ishlamay qolsa — masalan bepul trial tugagach — Render (zaxira)
# avtomatik yoqiladi. Railway sog'lom bo'lsa, Render avtomatik to'xtatiladi.
# Har 15 daqiqada tekshiriladi.
#
# Qo'lda yoqish: Actions -> "Render failover" -> Run workflow -> force = true

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Railway holatini tekshirmasdan Render'ni yoqish"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: render-failover
  cancel-in-progress: false

env:
  RAILWAY_HEALTH: https://yangiliklar-bot-production.up.railway.app/health
  RENDER_HEALTH: https://crypto-news-bot-lf0w.onrender.com/health
  RENDER_SERVICE: srv-db366g942hec738n7810

jobs:
  failover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Railway holatini tekshirish (2 bosqich)
        id: rail
        if: ${{ !inputs.force }}
        run: |
          check() {
            local alive=0 code
            for i in $(seq 1 "$1"); do
              code=$(curl -s -o /dev/null -m 20 -w "%{http_code}" "$RAILWAY_HEALTH" || echo 000)
              echo "  urinish $i: HTTP $code" >&2
              if [ "$code" = "200" ]; then alive=$((alive+1)); fi
              sleep 20
            done
            echo "$alive"
          }

          echo "1-bosqich (2 daqiqa):"
          alive=$(check 6)
          echo "javoblar: $alive/6"

          # Xavfsizlik: agar qiymat raqam bo'lmasa — Railway ishlayapti deb hisoblaymiz
          case "$alive" in ''|*[!0-9]*) alive=1 ;; esac

          if [ "$alive" -eq 0 ]; then
            # Deploy/restart kabi qisqa uzilishlarni istisno qilish uchun 2 daqiqa kutamiz
            echo "2-bosqich: 2 daqiqadan keyin qayta tekshirish..."
            sleep 120
            alive=$(check 3)
            echo "javoblar: $alive/3"
            case "$alive" in ''|*[!0-9]*) alive=1 ;; esac
          fi

          if [ "$alive" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Railway ishlayapti."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Railway javob bermayapti — Render'ga o'tiladi"
          fi

      - name: Render holati
        id: render
        if: ${{ always() }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          svc=$(curl -s -m 30 "https://api.render.com/v1/services/$RENDER_SERVICE" \
                 -H "Authorization: Bearer $RENDER_API_KEY")
          suspended=$(echo "$svc" | python3 -c "import json,sys; d=json.load(sys.stdin); s=d.get('service',d); print(s.get('suspended',''))" 2>/dev/null || echo "unknown")
          echo "Render holati: $suspended"
          echo "suspended=$suspended" >> "$GITHUB_OUTPUT"

      # ── Holat 1: Railway sog'lom → Render to'xtatiladi (ikki bot bo'lmasin) ──
      - name: Render'ni to'xtatish (Railway sog'lom)
        id: suspend
        if: ${{ steps.rail.outputs.skip == 'true' && steps.render.outputs.suspended == 'not_suspended' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          code=$(curl -s -m 60 -o /dev/null -w "%{http_code}" -X POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE/suspend" \
            -H "Authorization: Bearer $RENDER_API_KEY")
          echo "suspend HTTP $code"
          echo "done=true" >> "$GITHUB_OUTPUT"

      # ── Holat 2: Railway o'chgan → Render yoqiladi ──
      - name: Render'ni yoqish (Railway o'chgan)
        id: resume
        if: ${{ steps.rail.outputs.skip == 'false' && steps.render.outputs.suspended != 'not_suspended' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          code=$(curl -s -m 60 -o /dev/null -w "%{http_code}" -X POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE/resume" \
            -H "Authorization: Bearer $RENDER_API_KEY")
          echo "resume HTTP $code"
          [ "$code" = "202" ] || [ "$code" = "200" ] || { echo "::error::Render resume xato ($code)"; exit 1; }
          echo "done=true" >> "$GITHUB_OUTPUT"

      - name: Render ishga tushishini kutish (5 daqiqagacha)
        if: ${{ steps.resume.outputs.done == 'true' }}
        run: |
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -m 20 -w "%{http_code}" "$RENDER_HEALTH" || echo 000)
            echo "render urinish $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "::notice::Render ishga tushdi ✅"
              exit 0
            fi
            sleep 20
          done
          echo "::error::Render 5 daqiqada javob bermadi"
          exit 1

      - name: Adminga xabar (Render yoqildi)
        if: ${{ success() && steps.resume.outputs.done == 'true' }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.ADMIN_CHAT_ID }}
        run: |
          curl -s -m 20 -o /dev/null "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -d chat_id="$TG_CHAT" \
            --data-urlencode "text=🔄 Railway javob bermadi — bot Render'da avtomatik ishga tushdi. Health: $RENDER_HEALTH"

      - name: Adminga xabar (Render to'xtatildi)
        if: ${{ success() && steps.suspend.outputs.done == 'true' }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.ADMIN_CHAT_ID }}
        run: |
          curl -s -m 20 -o /dev/null "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -d chat_id="$TG_CHAT" \
            --data-urlencode "text=✅ Railway sog'lom — Render avtomatik to'xtatildi (ikki bot birga ishlamasligi uchun)."

      - name: Natija
        if: always()
        run: |
          echo "### Failover natijasi" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Qadam | Natija |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Railway ishlayaptimi | ${{ steps.rail.outputs.skip == 'true' && 'ha ✅' || 'yoq ❌' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Render holati (oldin) | ${{ steps.render.outputs.suspended }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Render yoqildimi | ${{ steps.resume.outputs.done == 'true' && 'ha' || 'yoq' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Render to'xtatildimi | ${{ steps.suspend.outputs.done == 'true' && 'ha' || 'yoq' }} |" >> "$GITHUB_STEP_SUMMARY"
