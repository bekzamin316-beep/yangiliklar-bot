name: Switch back to Railway

# Railway'ga qaytish: avval Railway sog'lom ekanini tekshiradi,
# keyin Render'ni to'xtatadi (ikki bot bir vaqtda polling qilmasligi uchun).
#
# Qo'lda: Actions -> "Switch back to Railway" -> Run workflow

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-failover
  cancel-in-progress: false

env:
  RAILWAY_HEALTH: https://yangiliklar-bot-production.up.railway.app/health
  RENDER_SERVICE: srv-db366g942hec738n7810

jobs:
  switch-back:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Railway sog'lom ekanini tekshirish
        run: |
          ok=0
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -m 20 -w "%{http_code}" "$RAILWAY_HEALTH" || echo 000)
            echo "urinish $i: HTTP $code"
            if [ "$code" = "200" ]; then ok=$((ok+1)); fi
            sleep 15
          done
          if [ "$ok" -lt 2 ]; then
            echo "::error::Railway sog'lom emas ($ok/3) — Render to'xtatilmadi"
            exit 1
          fi
          echo "Railway sog'lom ($ok/3) ✅"

      - name: Render'ni to'xtatish
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          svc=$(curl -s -m 30 "https://api.render.com/v1/services/$RENDER_SERVICE" \
                 -H "Authorization: Bearer $RENDER_API_KEY")
          suspended=$(echo "$svc" | python3 -c "import json,sys; d=json.load(sys.stdin); s=d.get('service',d); print(s.get('suspended',''))" 2>/dev/null || echo "unknown")
          echo "Render holati: $suspended"
          if [ "$suspended" = "suspended" ]; then
            echo "Render allaqachon to'xtatilgan."
            exit 0
          fi
          code=$(curl -s -m 60 -o /dev/null -w "%{http_code}" -X POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE/suspend" \
            -H "Authorization: Bearer $RENDER_API_KEY")
          echo "suspend HTTP $code"
          [ "$code" = "202" ] || [ "$code" = "200" ] || { echo "::error::Render suspend xato ($code)"; exit 1; }

      - name: Adminga xabar (Telegram)
        if: success()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.ADMIN_CHAT_ID }}
        run: |
          curl -s -m 20 -o /dev/null "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -d chat_id="$TG_CHAT" \
            --data-urlencode "text=✅ Railway'ga qaytildi: bot Railway'da ishlayapti, Render to'xtatildi."
